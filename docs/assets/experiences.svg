<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="title desc">
<title id="title">Three experiences, one workspace</title><desc id="desc">Full control, Guided with up to three actions, and Autopilot with one action all use the same underlying work.</desc>
<defs><linearGradient id="base" x2="1" y2="1"><stop stop-color="#0a1929"/><stop offset="1" stop-color="#070e19"/></linearGradient><linearGradient id="accent"><stop stop-color="#52e8ff"/><stop offset="1" stop-color="#b59aff"/></linearGradient></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="1198" height="336" rx="22" fill="url(#base)" stroke="#243649" /><rect x="22" y="22" width="368" height="244" rx="16" fill="#0c1b2b" stroke="#66e2b0" stroke-opacity=".48"/><rect x="45" y="44" width="52" height="52" rx="12" fill="#122337" stroke="#304860" /><g transform="translate(71 70) scale(0.9)" fill="none" stroke="#66e2b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-14" width="10" height="10" rx="2"/><rect x="4" y="-14" width="10" height="10" rx="2"/><rect x="-14" y="4" width="10" height="10" rx="2"/><rect x="4" y="4" width="10" height="10" rx="2"/></g><text x="46" y="132" fill="#66e2b0" font-size="20" font-weight="700" letter-spacing="1">FULL CONTROL</text><text x="46" y="173" fill="#eff7ff" font-size="21" font-weight="600" >Shape your workspace.</text><text x="46" y="205" fill="#9db4c8" font-size="16" font-weight="400" >Dashboard, capture, and layout.</text><rect x="46" y="228" width="94" height="10" rx="4" fill="#66e2b0" stroke="none" opacity=".25"/><rect x="149" y="228" width="94" height="10" rx="4" fill="#66e2b0" stroke="none" opacity=".25"/><rect x="252" y="228" width="94" height="10" rx="4" fill="#66e2b0" stroke="none" opacity=".25"/><rect x="416" y="22" width="368" height="244" rx="16" fill="#0c1b2b" stroke="#b59aff" stroke-opacity=".48"/><rect x="439" y="44" width="52" height="52" rx="12" fill="#122337" stroke="#304860" /><g transform="translate(465 70) scale(0.9)" fill="none" stroke="#b59aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 -10H-12M-6 -10H16M-16 0H-12M-6 0H16M-16 10H-12M-6 10H16"/></g><text x="440" y="132" fill="#b59aff" font-size="20" font-weight="700" letter-spacing="1">GUIDED</text><text x="440" y="173" fill="#eff7ff" font-size="21" font-weight="600" >Choose from a few actions.</text><text x="440" y="205" fill="#9db4c8" font-size="16" font-weight="400" >Up to three recommendations.</text><rect x="440" y="228" width="94" height="10" rx="4" fill="#b59aff" stroke="none" opacity=".55"/><rect x="543" y="228" width="94" height="10" rx="4" fill="#b59aff" stroke="none" opacity=".55"/><rect x="646" y="228" width="94" height="10" rx="4" fill="#b59aff" stroke="none" opacity=".55"/><rect x="810" y="22" width="368" height="244" rx="16" fill="#0c1b2b" stroke="#52e8ff" stroke-opacity=".48"/><rect x="833" y="44" width="52" height="52" rx="12" fill="#122337" stroke="#304860" /><g transform="translate(859 70) scale(0.9)" fill="none" stroke="#52e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle r="13"/><circle r="5"/><path d="M0 -19V-12M0 12V19M-19 0H-12M12 0H19"/></g><text x="834" y="132" fill="#52e8ff" font-size="20" font-weight="700" letter-spacing="1">AUTOPILOT</text><text x="834" y="173" fill="#eff7ff" font-size="21" font-weight="600" >Begin with one action.</text><text x="834" y="205" fill="#9db4c8" font-size="16" font-weight="400" >A clear next step and its reason.</text><rect x="834" y="228" width="306" height="10" rx="4" fill="#52e8ff" stroke="none" opacity=".55"/><text x="600" y="308" fill="#9db4c8" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="1.5">SAME TASKS  ·  SAME PROJECTS  ·  SAME EARNED HISTORY</text></g>
</svg>