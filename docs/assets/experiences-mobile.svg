<svg xmlns="http://www.w3.org/2000/svg" width="600" height="831" viewBox="0 0 600 831" role="img" aria-labelledby="title desc">
<title id="title">Three experiences, one workspace</title><desc id="desc">Full control, Guided and Autopilot, arranged for a narrow screen.</desc>
<defs><linearGradient id="base" x2="1" y2="1"><stop stop-color="#0a1929"/><stop offset="1" stop-color="#070e19"/></linearGradient><linearGradient id="accent"><stop stop-color="#52e8ff"/><stop offset="1" stop-color="#b59aff"/></linearGradient></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="598" height="829" rx="22" fill="url(#base)" stroke="#243649" /><rect x="24" y="24" width="552" height="224" rx="16" fill="#0c1b2b" stroke="#66e2b0" stroke-opacity=".48"/><g transform="translate(63 72) scale(1.05)" fill="none" stroke="#66e2b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-14" width="10" height="10" rx="2"/><rect x="4" y="-14" width="10" height="10" rx="2"/><rect x="-14" y="4" width="10" height="10" rx="2"/><rect x="4" y="4" width="10" height="10" rx="2"/></g><text x="102" y="81" fill="#66e2b0" font-size="24" font-weight="700" letter-spacing="1">FULL CONTROL</text><text x="51" y="143" fill="#eff7ff" font-size="29" font-weight="600" >Shape your workspace.</text><text x="51" y="182" fill="#9db4c8" font-size="23" font-weight="400" >Dashboard, capture, and layout.</text><path d="M51 214 L526 214" fill="none" stroke="#66e2b0" stroke-width="3" opacity=".55"/><rect x="24" y="268" width="552" height="224" rx="16" fill="#0c1b2b" stroke="#b59aff" stroke-opacity=".48"/><g transform="translate(63 316) scale(1.05)" fill="none" stroke="#b59aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 -10H-12M-6 -10H16M-16 0H-12M-6 0H16M-16 10H-12M-6 10H16"/></g><text x="102" y="325" fill="#b59aff" font-size="24" font-weight="700" letter-spacing="1">GUIDED</text><text x="51" y="387" fill="#eff7ff" font-size="29" font-weight="600" >Choose from a few actions.</text><text x="51" y="426" fill="#9db4c8" font-size="23" font-weight="400" >Up to three recommendations.</text><path d="M51 458 L526 458" fill="none" stroke="#b59aff" stroke-width="3" opacity=".55"/><rect x="24" y="512" width="552" height="224" rx="16" fill="#0c1b2b" stroke="#52e8ff" stroke-opacity=".48"/><g transform="translate(63 560) scale(1.05)" fill="none" stroke="#52e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle r="13"/><circle r="5"/><path d="M0 -19V-12M0 12V19M-19 0H-12M12 0H19"/></g><text x="102" y="569" fill="#52e8ff" font-size="24" font-weight="700" letter-spacing="1">AUTOPILOT</text><text x="51" y="631" fill="#eff7ff" font-size="29" font-weight="600" >Begin with one action.</text><text x="51" y="670" fill="#9db4c8" font-size="23" font-weight="400" >A clear next step and its reason.</text><path d="M51 702 L526 702" fill="none" stroke="#52e8ff" stroke-width="3" opacity=".55"/><text x="300" y="780" fill="#9db4c8" font-size="19" font-weight="600" text-anchor="middle">SAME WORK. DIFFERENT AMOUNTS OF CONTROL.</text></g>
</svg>